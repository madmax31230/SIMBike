<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIMBike - V7 GLTF Animé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Chargeur pour le modèle 3D externe -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="flex justify-between items-start interactive">
            <div class="flex gap-3">
                <select id="stage-selector" class="bg-slate-800 text-white font-bold py-2 px-4 rounded-lg border border-slate-600 outline-none">
                    <option value="0">Plaine (0%)</option>
                    <option value="5">Col (5%)</option>
                    <option value="8">Col HC (8%)</option>
                </select>
                <button id="btn-weather" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg transition">🌧️ Pluie</button>
                <button id="btn-simulate" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded-lg transition">Simuler</button>
            </div>
            <button id="btn-connect" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg transition flex items-center gap-2">
                PM5 Connect
            </button>
        </div>
        
        <div class="flex justify-end items-end pb-2 interactive">
            <div class="bg-slate-800/80 p-4 rounded-lg border-l-4 border-yellow-400 text-white">
                <div class="text-xs text-yellow-400 font-bold mb-1">LIÈVRE VIRTUEL (120W)</div>
                <div>Écart : <span id="val-gap" class="text-2xl font-black">0</span> m</div>
            </div>
        </div>
    </div>

    <script>
        // --- REGLAGES ET VARIABLES ---
        const PLAYER_WEIGHT = 135; 
        const BOT_WEIGHT = 80;
        let player = { watts: 0, speed: 0, dist: 0 };
        let bot = { watts: 120, speed: 0, dist: 0 };
        let gap = 0, currentSlope = 0, isRaining = false;
        let mixer; // Pour l'animation du cycliste 3D

        // --- MOTEUR 3D ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x3a5a78); 
        scene.fog = new THREE.FogExp2(0x3a5a78, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 0); 
        scene.add(camera); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x8899aa, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(50, 100, -50);
        sun.castShadow = true;
        scene.add(sun);

        // --- ENVIRONNEMENT (Route PBR et Lignes) ---
        const roadCanvas = document.createElement('canvas');
        roadCanvas.width = 256; roadCanvas.height = 256;
        const roadCtx = roadCanvas.getContext('2d');
        for(let i=0; i<256; i+=2) {
            for(let j=0; j<256; j+=2) {
                const c = Math.floor(Math.random() * 40 + 30);
                roadCtx.fillStyle = `rgb(${c},${c},${c})`;
                roadCtx.fillRect(i, j, 2, 2);
            }
        }
        const bumpTex = new THREE.CanvasTexture(roadCanvas);
        bumpTex.wrapS = THREE.RepeatWrapping; bumpTex.wrapT = THREE.RepeatWrapping;
        bumpTex.repeat.set(4, 100);

        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(7, 1000), 
            new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9, bumpMap: bumpTex, bumpScale: 0.02 })
        );
        road.rotation.x = -Math.PI / 2; road.position.y = 0.02; road.receiveShadow = true;
        scene.add(road);

        const plane = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ color: 0x2e4a22 }));
        plane.rotation.x = -Math.PI / 2; plane.receiveShadow = true; scene.add(plane);

        const sceneObjects = [];
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xdddddd });
        for(let i=0; i<30; i++) {
            const line = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 3), lineMat);
            line.rotation.x = -Math.PI / 2; line.position.set(0, 0.03, -i * 10);
            scene.add(line); sceneObjects.push({ mesh: line, offset: 10, total: 30 });
        }

        // --- METEO ---
        const rainCount = 1500;
        const rainGeo = new THREE.BufferGeometry();
        const rainPositions = new Float32Array(rainCount * 3);
        const rainVelocities = [];
        for(let i=0;i<rainCount;i++) {
            rainPositions[i*3] = (Math.random() - 0.5) * 20; 
            rainPositions[i*3+1] = Math.random() * 20; 
            rainPositions[i*3+2] = (Math.random() - 0.5) * 40 - 10; 
            rainVelocities.push(0.1 + Math.random() * 0.2); 
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
        const rainSystem = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.1, transparent: true, opacity: 0.6 }));
        rainSystem.visible = false;
        camera.add(rainSystem); 

        // --- GPS 3D ---
        const gpsCanvas = document.createElement('canvas');
        gpsCanvas.width = 256; gpsCanvas.height = 128;
        const gpsCtx = gpsCanvas.getContext('2d');
        const gpsTexture = new THREE.CanvasTexture(gpsCanvas);

        const gpsMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.15), new THREE.MeshBasicMaterial({ map: gpsTexture }));
        gpsMesh.position.set(0, -0.4, -0.6); 
        gpsMesh.rotation.x = -0.2; 
        camera.add(gpsMesh);

        function updateGpsScreen() {
            gpsCtx.fillStyle = '#111111'; gpsCtx.fillRect(0, 0, 256, 128);
            gpsCtx.fillStyle = '#00ff00'; gpsCtx.font = 'bold 36px sans-serif';
            gpsCtx.fillText(`${Math.round(player.watts)} W`, 20, 50);
            gpsCtx.fillStyle = '#00aaff'; gpsCtx.fillText(`${player.speed.toFixed(1)} km/h`, 20, 100);
            gpsCtx.fillStyle = '#ff8800'; gpsCtx.font = '20px sans-serif';
            gpsCtx.fillText(`Dist: ${Math.round(player.dist)} m`, 130, 80);
            gpsTexture.needsUpdate = true; 
        }

        // --- INTEGRATION DU MODELE GLTF (VELO.GLB) ---
        let botGroup = new THREE.Group();
        scene.add(botGroup);

        const loader = new THREE.GLTFLoader();
        loader.load('velo.glb', function (gltf) {
            const bot3D = gltf.scene;
            
            // On le tourne pour qu'il soit de dos s'il fait face à la caméra par défaut
            bot3D.rotation.y = Math.PI / 2; 
            
            // Ajustement de l'échelle (à modifier si le cycliste est trop grand/petit)
            bot3D.scale.set(0.8, 0.8, 0.8); 
            bot3D.position.y = 0.02; // Posé sur la route

            scene.remove(botGroup); 
            botGroup = bot3D; 
            scene.add(botGroup);
            
            botGroup.traverse((node) => { 
                if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; } 
            });

            // On récupère et prépare l'animation
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(botGroup);
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
            }
        }, undefined, function (error) {
            console.error('Erreur chargement velo.glb:', error);
            // Fallback si le fichier n'est pas trouvé
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.6), new THREE.MeshStandardMaterial({color: 0xff0000}));
            torso.position.y = 1; scene.add(torso); botGroup = torso;
        });

        // --- MOTEUR PHYSIQUE ---
        function calculateSpeed(watts, weight, currentSpeed, slopePercent) {
            if (watts <= 0) return Math.max(0, currentSpeed - 0.3); 
            const speedMs = Math.max(1, currentSpeed / 3.6);
            let resistance = ((weight + 9) * 9.81 * (isRaining ? 0.006 : 0.004)) + (0.5 * 1.2 * 0.4 * Math.pow(speedMs, 2));
            resistance += ((weight + 9) * 9.81 * Math.sin(Math.atan(slopePercent / 100)));
            let acc = ((watts / speedMs) - resistance) / (weight + 9);
            return Math.max(0, speedMs + (acc * 0.1)) * 3.6;
        }

        function updatePhysics() {
            currentSlope = parseFloat(document.getElementById('stage-selector').value);
            camera.rotation.x = Math.atan(currentSlope / 100) * 0.5;

            player.speed = calculateSpeed(player.watts, PLAYER_WEIGHT, player.speed, currentSlope);
            bot.speed = (player.speed > 2 || bot.speed > 0) ? calculateSpeed(bot.watts, BOT_WEIGHT, bot.speed, currentSlope) : 0;

            player.dist += (player.speed / 36); 
            bot.dist += (bot.speed / 36);
            gap = bot.dist - player.dist;

            document.getElementById('val-gap').innerText = (gap >= 0 ? "+" : "") + Math.round(gap);
            document.getElementById('val-gap').className = gap >= 0 ? "text-2xl font-black text-yellow-400" : "text-2xl font-black text-emerald-400";
            updateGpsScreen(); 
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            // Animation du pédalage calée sur la vitesse
            if (mixer) {
                // Modifie la vitesse de rotation des jambes du modèle 3D
                mixer.timeScale = bot.speed > 0 ? (bot.speed / 15) : 0; 
                mixer.update(delta);
            }
            
            sceneObjects.forEach(item => {
                item.mesh.position.z += (player.speed / 3.6) * delta;
                if(item.mesh.position.z > 5) item.mesh.position.z -= (item.offset * item.total);
            });

            if(isRaining) {
                const positions = rainGeo.attributes.position.array;
                for(let i=0; i<rainCount; i++) {
                    positions[i*3+1] -= rainVelocities[i] + (player.speed/100); 
                    if(positions[i*3+1] < 0) positions[i*3+1] = 20; 
                }
                rainGeo.attributes.position.needsUpdate = true;
            }

            botGroup.visible = (gap > -2 && gap < 150);
            if(botGroup.visible) {
                botGroup.position.z = -gap - 3; // Maintenu à -3m devant la caméra pour bien le voir
            }
            
            renderer.render(scene, camera);
        }
        setInterval(updatePhysics, 100); animate();

        // --- UI & BLUETOOTH ---
        document.getElementById('btn-weather').addEventListener('click', (e) => {
            isRaining = !isRaining;
            rainSystem.visible = isRaining;
            scene.background = new THREE.Color(isRaining ? 0x223344 : 0x3a5a78); 
            e.target.innerText = isRaining ? "☀️ Soleil" : "🌧 Pluie";
        });

        let simInterval;
        document.getElementById('btn-simulate').addEventListener('click', (e) => {
            if(!simInterval) {
                simInterval = setInterval(() => { player.watts = 150 + Math.random() * 60; }, 1000);
            } else {
                clearInterval(simInterval); simInterval = null; player.watts = 0;
            }
        });
        
        document.getElementById('btn-connect').addEventListener('click', async (e) => {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['cycling_power'] }] });
                const server = await device.gatt.connect();
                const char = await (await server.getPrimaryService('cycling_power')).getCharacteristic('cycling_power_measurement');
                await char.startNotifications();
                e.target.innerText = "PM5 OK"; e.target.classList.replace('bg-blue-600', 'bg-emerald-600');
                char.addEventListener('characteristicvaluechanged', (evt) => { player.watts = evt.target.value.getInt16(2, true); });
            } catch (err) {}
        });
    </script>
</body>
</html>
