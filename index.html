<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIMBike - V4 Montagne</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .interactive { pointer-events: auto; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 15px; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .metric-value { font-size: 2.2rem; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
        .metric-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; letter-spacing: 1px; margin-bottom: 2px;}
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <!-- Barre supérieure avec Sélection du Parcours -->
        <div class="flex justify-between items-start interactive">
            <div class="flex gap-3">
                <select id="stage-selector" class="bg-slate-800 text-white font-bold py-2 px-4 rounded-lg shadow-lg border border-slate-600 outline-none focus:border-blue-500">
                    <option value="0">Prologue Plat (0%)</option>
                    <option value="2">Faux-plat montant (2%)</option>
                    <option value="5">Col 2ème Catégorie (5%)</option>
                    <option value="8">Col Hors Catégorie (8%)</option>
                </select>
                <button id="btn-simulate" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded-lg shadow-lg transition">Simuler</button>
            </div>
            <button id="btn-connect" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-lg shadow-lg transition flex items-center gap-2">
                PM5 Connect
            </button>
        </div>

        <div class="flex justify-between items-end pb-2">
            <!-- HUD Joueur -->
            <div class="glass-panel min-w-[240px]">
                <div class="flex justify-between border-b border-slate-700 pb-3 mb-3">
                    <div>
                        <div class="metric-label text-blue-400">Watts (Toi)</div>
                        <div class="metric-value"><span id="val-watts">0</span></div>
                    </div>
                    <div class="text-right">
                        <div class="metric-label text-emerald-400">Vitesse</div>
                        <div class="metric-value"><span id="val-speed">0.0</span><span class="text-sm text-gray-400 ml-1">km/h</span></div>
                    </div>
                </div>
                <div class="flex justify-between">
                    <div>
                        <div class="metric-label">Pente Active</div>
                        <div class="text-xl font-bold text-orange-400"><span id="val-slope">0</span> %</div>
                    </div>
                    <div class="text-right">
                        <div class="metric-label">Distance</div>
                        <div class="text-xl font-bold"><span id="val-dist">0</span> m</div>
                    </div>
                </div>
            </div>

            <!-- HUD Bot -->
            <div class="glass-panel min-w-[240px] border-l-4 border-l-yellow-400">
                <div class="flex justify-between items-center mb-3">
                    <div class="font-bold text-yellow-400">Lièvre Virtuel</div>
                    <div class="text-xs bg-slate-700 text-slate-300 px-2 py-1 rounded">120W / 80kg</div>
                </div>
                <div class="flex justify-between items-end">
                    <div>
                        <div class="metric-label">Écart</div>
                        <div class="text-3xl font-black text-white"><span id="val-gap">0</span><span class="text-sm text-gray-400 ml-1">m</span></div>
                    </div>
                    <div class="text-right text-gray-300 font-bold">
                        <span id="val-bot-speed">0.0</span> km/h
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- PHYSIQUE & CONSTANTES ---
        const PLAYER_WEIGHT = 135; 
        const BOT_WEIGHT = 80;
        const BOT_WATTS = 120;
        
        let player = { watts: 0, speed: 0, dist: 0 };
        let bot = { watts: 0, speed: 0, dist: 0 };
        let gap = 0; 
        let currentSlope = 0; // Pourcentage de la pente

        // --- MOTEUR 3D (Lumières, Ombres & Ciel) ---
        const scene = new THREE.Scene();
        // Ciel couleur crépuscule
        scene.background = new THREE.Color(0xff7e5f); 
        scene.fog = new THREE.FogExp2(0xff7e5f, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.8, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Activation des ombres !
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Éclairage dramatique
        const ambientLight = new THREE.AmbientLight(0xffedd5, 0.4);
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(50, 100, -50);
        sunLight.castShadow = true;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        scene.add(sunLight);

        // --- ENVIRONNEMENT ---
        // Sol
        const planeGeo = new THREE.PlaneGeometry(1000, 1000);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x2d4c1e, roughness: 1 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // Route
        const roadGeo = new THREE.PlaneGeometry(8, 1000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.02;
        road.receiveShadow = true;
        scene.add(road);

        const sceneObjects = [];

        // Montagnes procédurales au loin
        const mountMat = new THREE.MeshLambertMaterial({ color: 0x1f2937 });
        for(let i=0; i<10; i++) {
            const mountGeo = new THREE.ConeGeometry(40 + Math.random()*50, 60 + Math.random()*80, 4);
            const mount = new THREE.Mesh(mountGeo, mountMat);
            const side = Math.random() > 0.5 ? 1 : -1;
            mount.position.set(side * (50 + Math.random()*100), 0, -200 - Math.random()*100);
            mount.rotation.y = Math.random();
            scene.add(mount);
        }

        // Arbres avec ombres
        const treeGeo = new THREE.ConeGeometry(1.5, 5, 5);
        const treeMat = new THREE.MeshStandardMaterial({ color: 0x113311 });
        const trunkGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.5);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3d2314 });
        
        for(let i=0; i<40; i++) {
            const tree = new THREE.Group();
            const leaves = new THREE.Mesh(treeGeo, treeMat);
            leaves.position.y = 3;
            leaves.castShadow = true;
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            tree.add(leaves, trunk);
            
            const side = Math.random() > 0.5 ? 1 : -1;
            tree.position.set(side * (6 + Math.random() * 12), 0, -(Math.random() * 200));
            scene.add(tree);
            sceneObjects.push({ mesh: tree, offset: 200, total: 1 });
        }

        // Lignes blanches
        const lineGeo = new THREE.PlaneGeometry(0.15, 4);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for(let i=0; i<20; i++) {
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0.03, -i * 10);
            scene.add(line);
            sceneObjects.push({ mesh: line, offset: 10, total: 20 });
        }

        // --- CYCLISTE VIRTUEL ---
        const botGroup = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.6, 0.6), new THREE.MeshStandardMaterial({color: 0xffd700}));
        torso.position.set(0, 1.1, 0); torso.castShadow = true;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.18), new THREE.MeshStandardMaterial({color: 0x222222}));
        head.position.set(0, 1.5, -0.2); head.castShadow = true;
        botGroup.add(torso, head);
        scene.add(botGroup);

        // --- PHYSIQUE DE LA PENTE ---
        function calculateSpeed(watts, weight, currentSpeed, slopePercent) {
            if (watts <= 0) return Math.max(0, currentSpeed - 0.3); 
            
            const totalWeight = weight + 9; 
            const speedMs = Math.max(1, currentSpeed / 3.6);
            const force = watts / speedMs; 
            
            // Résistance au roulement + Aérodynamisme
            let resistance = (totalWeight * 9.81 * 0.004) + (0.5 * 1.2 * 0.4 * Math.pow(speedMs, 2));
            
            // LA GRAVITÉ (Le cœur de la difficulté !)
            const slopeAngle = Math.atan(slopePercent / 100);
            const gravity = totalWeight * 9.81 * Math.sin(slopeAngle);
            resistance += gravity;

            let acc = (force - resistance) / totalWeight;
            let newSpeed = speedMs + (acc * 0.1); 
            return Math.max(0, newSpeed * 3.6);
        }

        function updatePhysics() {
            currentSlope = parseFloat(document.getElementById('stage-selector').value);
            document.getElementById('val-slope').innerText = currentSlope;
            
            // Inclinaison de la caméra pour simuler la pente
            camera.rotation.x = Math.atan(currentSlope / 100) * 0.5;

            player.speed = calculateSpeed(player.watts, PLAYER_WEIGHT, player.speed, currentSlope);
            
            if(player.speed > 2 || bot.speed > 0) {
                bot.watts = BOT_WATTS;
                bot.speed = calculateSpeed(bot.watts, BOT_WEIGHT, bot.speed, currentSlope);
            } else {
                bot.watts = 0; bot.speed = 0;
            }

            player.dist += (player.speed / 36); 
            bot.dist += (bot.speed / 36);
            gap = bot.dist - player.dist;

            // UI
            document.getElementById('val-watts').innerText = Math.round(player.watts);
            document.getElementById('val-speed').innerText = player.speed.toFixed(1);
            document.getElementById('val-dist').innerText = Math.round(player.dist);
            document.getElementById('val-bot-speed').innerText = bot.speed.toFixed(1);
            
            let gapText = (gap >= 0 ? "+" : "") + Math.round(gap);
            document.getElementById('val-gap').innerText = gapText;
            document.getElementById('val-gap').className = gap >= 0 ? "text-yellow-400 font-black" : "text-emerald-400 font-black";
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const playerSpeedMs = player.speed / 3.6;
            
            // Défilement avec la vitesse
            sceneObjects.forEach(item => {
                item.mesh.position.z += playerSpeedMs * delta;
                if(item.mesh.position.z > 5) item.mesh.position.z -= (item.offset * (item.total || 1));
            });

            // Animation du Bot
            botGroup.visible = (gap > -2 && gap < 150);
            if(botGroup.visible) {
                botGroup.position.z = -gap - 2;
                if(bot.speed > 0) {
                    botGroup.position.y = Math.sin(clock.getElapsedTime() * 8) * 0.05;
                }
            }
            renderer.render(scene, camera);
        }

        setInterval(updatePhysics, 100);
        animate();

        // --- ACTIONS ---
        let simInterval;
        document.getElementById('btn-simulate').addEventListener('click', (e) => {
            if(!simInterval) {
                e.target.innerText = "🛑 Stop";
                simInterval = setInterval(() => { player.watts = 150 + Math.random() * 40; }, 1000);
            } else {
                e.target.innerText = "Simuler";
                clearInterval(simInterval); simInterval = null; player.watts = 0;
            }
        });

        document.getElementById('btn-connect').addEventListener('click', async (e) => {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['cycling_power'] }] });
                const server = await device.gatt.connect();
                const char = await (await server.getPrimaryService('cycling_power')).getCharacteristic('cycling_power_measurement');
                await char.startNotifications();
                e.target.innerText = "PM5 OK"; e.target.classList.replace('bg-blue-600', 'bg-emerald-600');
                if(simInterval) document.getElementById('btn-simulate').click();
                char.addEventListener('characteristicvaluechanged', (evt) => { player.watts = evt.target.value.getInt16(2, true); });
            } catch (err) { alert("Erreur Bluetooth"); }
        });
    </script>
</body>
</html>
